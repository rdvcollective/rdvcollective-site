name: Convert RDV original photos to JPEG
on:
  push:
    paths:
      - '.github/workflows/convert-rdv-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Preserve original photographs as compatible JPEGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re
          names = ['rdv-hospitality-property','rdv-city-view-lounge','rdv-hospitality-bar','rdv-destination-coast']
          for name in names:
              source = Path('images') / (name + '.webp')
              target = Path('images') / (name + '.jpg')
              with Image.open(source) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im.save(target, 'JPEG', quality=90, optimize=True, progressive=True)
              print(f'Converted {source} to {target}')
          for html in Path('.').rglob('*.html'):
              if '.git' in html.parts:
                  continue
              original = html.read_text(encoding='utf-8')
              updated = original
              for name in names:
                  updated = updated.replace(name + '.webp', name + '.jpg')
              # Remove obsolete fallbacks that substituted unrelated photos.
              updated = re.sub(r'\s+onerror="this\.onerror=null;this\.src=\x27[^\x27]*\x27;this\.alt=\x27[^\x27]*\x27"', '', updated)
              if updated != original:
                  html.write_text(updated, encoding='utf-8')
                  print(f'Updated {html}')
          PY
      - name: Commit compatible images and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg '*.html' '*/index.html'
          if ! git diff --cached --quiet; then
            git commit -m "Preserve RDV original photography in browser-compatible JPEG"
            git push
          fi
